<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康與安全小達人 30 題終極挑戰 🌟</title>
    <style>
        /* === 核心可愛魔幻風格 CSS 魔法 === */
        :root {
            --bg-color: #181818;
            --primary-gold: #D4AF37;
            --white: #FFFFFF;
            --card-bg: #2A2A2A;
            --correct-green: #4CAF50;
            --wrong-red: #F44336;
            --text-muted: #B0B0B0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--white);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: var(--card-bg);
            border: 4px solid var(--primary-gold);
            border-radius: 24px;
            padding: 30px;
            max-width: 680px;
            width: 100%;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--primary-gold);
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px dashed var(--primary-gold);
        }

        .question-box {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: left;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            border-left: 5px solid var(--primary-gold);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            background-color: #333333;
            color: var(--white);
            border: 2px solid #555555;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--primary-gold);
            background-color: #3e3e3e;
            transform: scale(1.01);
        }

        .option-btn[disabled] {
            cursor: not-allowed;
        }

        /* 答對與答錯的 CSS 動畫觸發狀態 */
        .option-btn.correct {
            background-color: var(--correct-green) !important;
            border-color: #81C784 !important;
            animation: popCorrect 0.4s ease forwards;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            border-color: #E57373 !important;
        }

        .feedback-box {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            min-height: 35px;
        }

        .next-btn {
            margin-top: 20px;
            background-color: var(--primary-gold);
            color: #000000;
            border: none;
            border-radius: 50px;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(212,175,55,0.4);
            display: none;
            transition: all 0.2s ease;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(212,175,55,0.6);
        }

        /* === 華麗特效動畫 Keyframes === */
        @keyframes popCorrect {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(400px) rotate(360deg); opacity: 0; }
        }

        /* 慶祝彩色碎紙屑粒子 */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ff0;
            pointer-events: none;
            animation: confettiFall 1.5s linear forwards;
        }

        /* 結算畫面 */
        .result-screen {
            display: none;
        }
        
        .result-screen h2 {
            color: var(--primary-gold);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .score-star {
            font-size: 60px;
            margin: 20px 0;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .restart-btn {
            background-color: var(--white);
            color: #000000;
            border: 2px solid var(--primary-gold);
            border-radius: 50px;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.2s;
        }
        
        .restart-btn:hover {
            background-color: var(--primary-gold);
        }
    </style>
</head>
<body>

    <div class="game-container" id="main-container">
        <!-- 遊戲主畫面 -->
        <div id="quiz-screen">
            <h1>🪄 健康與安全小達人 30 題終極挑戰 💖</h1>
            <div class="subtitle">參考範圍：114國小健體3下課本PDF_單元01~04</div>
            <div class="status-bar">
                <span id="progress-text">題組：0 / 30</span>
                <span id="score-text">獲得寶石：💎 0</span>
            </div>
            <div class="question-box" id="question-text">
                正在用魔法召喚題目...
            </div>
            <div class="options-container" id="options-box">
                <!-- 由 JavaScript 注入 -->
            </div>
            <div class="feedback-box" id="feedback-text"></div>
            <button class="next-btn" id="next-button" onclick="nextQuestion()">➡️ 下一題</button>
        </div>

        <!-- 結算畫面 -->
        <div id="result-screen" class="result-screen">
            <h2>🎉 冒險完成！太厲害了！ 🎉</h2>
            <div class="score-star">⭐👑⭐</div>
            <p style="font-size: 20px;" id="final-score-text">你總共獲得了 0 顆珍貴的星鑽！</p>
            <p id="final-evaluation" style="color: var(--primary-gold); font-size: 18px; font-weight: bold;"></p>
            <button class="restart-btn" onclick="restartGame()">重新挑戰 🔄</button>
        </div>
    </div>

    <script>
        // === 30 題嚴謹選擇題庫（依據課本單元 01-04 內容精準設計） ===
        // 誘答性高、敘述專業不搞笑
        const questionBank = [
            // --- 單元 01：我的成長與人生階段 ---
            { q: "影響每個人生長發育的關鍵生活習慣中，主要包含下列哪三項要素？", a: ["睡眠、社交、課業發展", "睡眠、規律運動、均衡營養", "營養、戶外休閒、視力保健", "運動、補習、才藝學習"], c: 1 },
            { q: "關於同學間身高的增長速度各有不同，下列哪一項觀念最符合課文所述？", a: ["每個人的生長速度不同，只要養成良好習慣就能健康長大", "長得慢代表身體發育異常，必須立刻服用藥物治療", "每個人生長速度應完全相同，若不同需調整作息", "排隊排在第一個的同學，代表未來身高一定最矮"], c: 0 },
            { q: "「遺傳」是影響生長發育的因素之一，下列關於遺傳的敘述何者正確？", a: ["遺傳是由後天飲食環境決定的，可以隨時改變", "遺傳是與生俱來的，無法改變，但可透過後天方法幫助發育", "只要父母身高高，後天不運動不偏食也一定能長得很高", "只有兒童期的發育才會受到遺傳因素的支配"], c: 1 },
            { q: "為了促進身體正常發育與長高，課本建議學童每天至少應睡足多少小時？", a: ["至少 6 小時", "至少 7 小時", "至少 8 小時", "至少 10 小時"], c: 2 },
            { q: "在規律運動的行動計畫中，國小學童每天至少應維持多久的運動時間？", a: ["每天 10 分鐘", "每天 30 分鐘", "每週 30 分鐘", "每兩天 1 小時"], c: 1 },
            { q: "每個人從出生、長大到變老會經過好幾個人生階段。請問「兒童期」是指哪一個年齡區間？", a: ["0 ~ 6 歲", "7 ~ 12 歲", "13 ~ 18 歲", "19 ~ 64 歲"], c: 1 },
            { q: "關於「青少年期（13~18歲）」的發展特徵，下列敘述何者最適當？", a: ["學會坐、爬、站、走等基本能力，極需家人完全照顧", "努力工作，養育小孩，維持家庭整體生活", "開始注重外表，喜歡獨立，且重視人際關係", "體力開始衰退，咀嚼能力變弱，需要家人的陪伴"], c: 2 },
            { q: "正值發育與換牙階段的兒童期，在飲食上應特別多攝取哪些營養素以幫助骨骼與牙齒？", a: ["高脂肪與維生素C", "高鈉與碳水化合物", "鈣質與蛋白質", "鐵質與纖維質"], c: 2 },
            { q: "青少年期是發育的重要時期，女生若因生理期需要特別加強補充哪一種營養素？", a: ["補充鈣片", "多吃深綠色蔬菜和海產類以補充鐵質", "大量補充高熱量澱粉", "補充油炸類食品"], c: 1 },
            { q: "「老年期（65歲以上）」常因咀嚼與消化能力變弱而食量減少，此時的飲食安排何者正確？", a: ["應盡量選擇質地較硬、耐咀嚼的食物以鍛鍊牙齒", "可採取高油高鹽的調味方式以刺激食慾", "可以準備較軟的食物，並在兩餐之間補充點心", "應完全避免攝取含鈣食物以防止血管鈣化"], c: 2 },

            // --- 單元 02：防災應變與火場求生 ---
            { q: "發生火災撥打 119 報案時，下列哪一項資訊屬於必須清楚說明的首要內容？", a: ["起火地點的詳細地址與樓層", "報案人自己的身分證字號", "家中財產損失的預估金額", "起火房屋的屋齡與建材"], c: 0 },
            { q: "發生火災時，如果個人身上不小心著火了，應立刻執行什麼緊急避難動作？", a: ["快速向前奔跑，利用風力將火勢熄滅", "立刻停在原地、就地躺下、左右翻滾直到火勢熄滅", "用手掌或衣物用力拍打身體著火處", "尋找附近的塑膠袋套住著火的身體部位"], c: 1 },
            { q: "身上著火進行「停、躺、滾」翻滾時，越貼近地面越能阻絕下列哪一項物質助燃？", a: ["二氧化碳", "氮氣", "空氣（氧氣）", "水蒸氣"], c: 2 },
            { q: "烹煮食物時若暫時離開廚房，應謹記什麼防火原則以避免釀成火災？", a: ["「隨時開窗」原則", "「人離火熄」原則", "「大火快煮」原則", "「定期抽油」原則"], c: 1 },
            { q: "關於耗電量較大的電器（如電暖器、微波爐、電鍋）的使用安全，下列何者正確？", a: ["應全部插在同一條多孔插座延長線上以便管理", "各別插在單一或獨立的固定插座上，拔下不常用的插頭", "可以緊密纏繞綑綁電線以節省空間", "即使電線外皮受損也不需要更換"], c: 1 },
            { q: "火場求生避難時，若發現「門把發燙」或「門縫有濃煙」，此時正確的處置為何？", a: ["代表火勢尚遠，應立刻開門衝出樓梯逃生", "不可開門，應緊關房門、用毛巾塞住門縫，並開窗呼救或撥打119", "立刻用塑膠袋套住頭部，強行開門衝向頂樓", "躲入浴室內並關上門，因為浴室內有充足的水源"], c: 1 },
            { q: "火場逃生時，為什麼「絕對不能搭乘電梯」？", a: ["因為電梯空間太狹小，無法容納多人逃生", "電梯運行的速度太慢，會耽誤逃生黃金時間", "火災易導致斷電而使人受困電梯內，造成窒息或高溫危險", "搭乘電梯容易產生頭暈症狀，影響避難判斷"], c: 2 },
            { q: "居家各樓層的逃生計畫中，有關安全逃生路線的規劃原則何者正確？", a: ["應有兩個方向以上的逃生路線", "只能依賴大門作為唯一的單向出口", "窗戶若加裝鐵窗必須全部焊死，且不留任何鑰匙", "逃生通道與樓梯間可堆放雜物以增加收納"], c: 0 },
            { q: "關於滅火器的使用步驟，下列四個口訣動作的順序何者正確？", a: ["拉（插梢）→壓（握把）→瞄（底部）→掃（左右）", "拉（插梢）→瞄（底部）→壓（握把）→掃（左右）", "瞄（底部）→拉（插梢）→壓（握把）→掃（左右）", "壓（握把）→拉（插梢）→瞄（底部）→掃（左右）"], c: 1 },
            { q: "關於「住宅用火災警報器（住警器）」的安裝，下列敘述何者符合安全規範？", a: ["廚房因烹調常有油煙，應安裝「偵煙式」住警器", "房間、樓梯及客廳應安裝「定溫式」住警器", "廚房應安裝「定溫式」；房間、樓梯及客廳應安裝「偵煙式」", "住警器安裝後即可永久使用，終身不需要測試或更換電池"], c: 2 },

            // --- 單元 03：用藥安全與社區藥局 ---
            { q: "在網路發達的時代，常有誇大不實的醫藥偏方。下列哪一項是分辨真假訊息的正確態度？", a: ["只要標題新奇吸引人，就可以認定它是正確的專家意見", "詳細閱讀內文是否有根據，並向執照合格的醫師或藥師查證", "立刻轉傳分享給親友，讓大家一起嘗試效果", "偏方若宣稱有排毒反應，代表出現紅疹是正常的"], c: 1 },
            { q: "為了宣導正確用藥，購買藥品時應遵守「不聽、不信、不買、不吃、不推薦」的原則，這是針對什麼藥品？", a: ["醫師開立的處方藥品", "醫院領取的慢病處方箋藥品", "來路不明或標示不清的藥品", "健保特約藥局販售的合法成藥"], c: 2 },
            { q: "服藥後身體若出現皮膚紅疹、口腔潰瘍、嘴脣腫脹或眼睛紅腫灼熱，這可能是發生了什麼症狀？", a: ["藥物發揮療效的正常排毒現象", "對該藥物產生了「藥物過敏」的不良反應", "感冒病毒引起的併發症，應加倍服藥", "體內水分不足引起的過敏，多喝水即可緩解"], c: 1 },
            { q: "當懷疑自己出現藥物過敏的不良反應時，下列哪一項處置方式最安全？", a: ["自行調低服藥劑量，繼續把剩餘的藥吃完", "到藥局隨便買成藥來塗抹紅疹部位", "馬上停藥，並攜帶正在服用的藥物與藥袋儘速就醫", "多喝黑咖啡或茶飲以加速體內藥物排出"], c: 2 },
            { q: "若要認明住家附近的藥局是否為「健保特約藥局」，應辨識哪一種政府授權的標誌？", a: ["紅色十字的醫療救援標誌", "消防署認證的合格防火標誌", "綠色底、內有雙人執手圖樣的全民健康保險標誌", "食品藥物管理署的優良食品標誌"], c: 2 },
            { q: "社區藥局的執業藥師能提供多項便民服務，下列哪一項「不屬於」藥師的法定業務？", a: ["受理慢性病連續處方箋調劑領藥", "提供非處方藥品的購買諮詢與衛教", "協助回收廢棄醫療針筒與過期藥物", "代替醫師幫病患看診並開立全新處方箋"], c: 3 },

            // --- 單元 04：環境衛生與傳染病防治 ---
            { q: "有關登革熱的傳染途徑，下列敘述何者是完全正確的？", a: ["與病患近距離交談透過飛沫傳染", "吃到受老鼠排泄物污染的食物引發腸胃感染", "病媒蚊叮咬患者後病毒在蚊體內繁殖，再叮咬健康人而傳染", "吸入髒亂社區中的受污染空氣而感染"], c: 2 },
            { q: "在臺灣地區，傳染登革熱的病媒蚊主要是哪兩種斑蚊？", a: ["熱帶家蚊與地下家蚊", "埃及斑蚊與白線斑蚊", "中華瘧蚊與三斑家蚊", "東南亞瘧蚊與普通家蚊"], c: 1 },
            { q: "清除登革熱病媒蚊孳生源有四個核心步驟：「巡、倒、清、刷」。其中「刷」的主要目的是什麼？", a: ["刷洗地磚以維持公共區域的美觀", "刷洗容器內壁，徹底清除附著在上面的斑蚊蟲卵", "刷洗水溝底部的淤泥以利排水", "用刷子將飛行的成蚊直接擊落"], c: 1 },
            { q: "為了預防老鼠入侵住家並傳染疾病，課本建議落實防鼠「三不」措施。請問這「三不」是指什麼？", a: ["不看老鼠、不聽鼠聲、不觸摸老鼠", "不讓鼠住、不讓鼠來、不讓鼠吃", "不設陷阱、不放毒餌、不養貓咪", "不捕捉、不餵食、不接觸老鼠"], c: 1 }
        ];

        let currentIdx = 0;
        let score = 0;

        const questionText = document.getElementById('question-text');
        const optionsBox = document.getElementById('options-box');
        const feedbackText = document.getElementById('feedback-text');
        const nextButton = document.getElementById('next-button');
        const progressText = document.getElementById('progress-text');
        const scoreText = document.getElementById('score-text');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const finalScoreText = document.getElementById('final-score-text');
        const finalEvaluation = document.getElementById('final-evaluation');
        const mainContainer = document.getElementById('main-container');

        // 啟動遊戲大冒險
        function startQuiz() {
            currentIdx = 0;
            score = 0;
            quizScreen.style.display = 'block';
            resultScreen.style.display = 'none';
            updateProgressBar();
            showQuestion();
        }

        // 呈現題目與選項
        function showQuestion() {
            feedbackText.innerHTML = '';
            nextButton.style.display = 'none';
            
            progressText.innerText = `題組：${currentIdx + 1} / ${questionBank.length}`;
            
            const item = questionBank[currentIdx];
            questionText.innerText = `${currentIdx + 1}. ${item.q}`;
            
            optionsBox.innerHTML = '';
            item.a.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerText = option;
                button.classList.add('option-btn');
                button.onclick = () => checkAnswer(index, button);
                optionsBox.appendChild(button);
            });
        }

        // 判斷答案與給予正向鼓勵
        function checkAnswer(selectedIndex, selectedButton) {
            const item = questionBank[currentIdx];
            const allButtons = optionsBox.querySelectorAll('.option-btn');
            
            // 鎖定按鈕防止重複點擊
            allButtons.forEach(btn => btn.disabled = true);
            
            if (selectedIndex === item.c) {
                selectedButton.classList.add('correct');
                score++;
                updateProgressBar();
                
                // 充滿活力的正向激勵語
                const safePraises = ["哇！你好棒！🎉", "完全正確！🌟", "太厲害了！💖", "卓越的健康安全知識！👍", "一等星的表現！✨"];
                feedbackText.innerHTML = `<span style="color: var(--correct-green);">${safePraises[Math.floor(Math.random()*safePraises.length)]}</span>`;
                
                // 噴發彩色碎紙屑特效
                createConfetti();
            } else {
                selectedButton.classList.add('wrong');
                allButtons[item.c].classList.add('correct');
                
                // 溫和且具備建設性的提示回饋
                feedbackText.innerHTML = `<span style="color: #FFB300;">沒關係，我們再記一下！😊 正確答案是：${item.a[item.c]}</span>`;
            }
            
            nextButton.style.display = 'inline-block';
        }

        // 進入下一題或結算
        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questionBank.length) {
                showQuestion();
            } else {
                showFinalResults();
            }
        }

        // 更新計分板 (純變數運算，無次元儲物袋)
        function updateProgressBar() {
            scoreText.innerText = `獲得寶石：💎 ${score * 10}`;
        }

        // 施展 CSS 彩色碎紙屑噴發魔法
        function createConfetti() {
            for (let i = 0; i < 15; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '0px';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}deg, 100%, 60%)`;
                confetti.style.animationDelay = Math.random() * 0.2 + 's';
                mainContainer.appendChild(confetti);
                
                // 動畫結束後自動消滅粒子
                setTimeout(() => confetti.remove(), 1500);
            }
        }

        // 遊戲大結局結算畫面
        function showFinalResults() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            finalScoreText.innerText = `你總共答對了 ${score} / ${questionBank.length} 題，獲得了 💎 ${score * 10} 分！`;
            
            let evaluation = "";
            if (score === questionBank.length) {
                evaluation = "👑 太完美了！你就是具備最高榮譽的「健康與安全終極大魔法師」！ 👑";
            } else if (score >= 24) {
                evaluation = "🌟 超級優異！你對生活好習慣與防災用藥知識非常熟悉，是大家的守護小模範！ 🌟";
            } else if (score >= 15) {
                evaluation = "👍 做得很好！你已經掌握了大部分的健康核心技能，生活一定平安又快樂！ 👍";
            } else {
                evaluation = "💪 差一點點！健康與安全是需要持續累積的魔法，再挑戰一次，你會變得更強大！ 💪";
            }
            finalEvaluation.innerText = evaluation;
        }

        // 重新洗牌挑戰
        function restartGame() {
            startQuiz();
        }

        // 網頁準備就緒，立刻啟動魔法
        document.addEventListener('DOMContentLoaded', () => {
            startQuiz();
        });
    </script>
</body>
</html>
